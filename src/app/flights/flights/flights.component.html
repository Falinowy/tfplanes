<div class="row flights-container">
  @for (flight of flights$ | async; track flight) {
    <div class="col-12 col-lg-6 col-xl-4 flight-col" (click)="showDetails(flight)">
      <div class="module continent">
        <app-flight-card [flight]="flight"></app-flight-card>
      </div>
    </div>
  }
</div>
<button mat-fab extended color="primary" class="modern-fab" (click)="openNewFlightModal()">
  <mat-icon>add</mat-icon>
  New Flight
</button>
