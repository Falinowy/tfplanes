<div class="edit-flight-container">
  <div class="edit-flight-header">
    <div class="title-container">
      <mat-icon class="header-icon">edit_note</mat-icon>
      <h3>Edit Flight <strong>{{ flight?.code }}</strong></h3>
    </div>
    <button mat-icon-button color="warn" (click)="removeFlight()" class="delete-btn" matTooltip="Delete Flight">
      <mat-icon>delete_forever</mat-icon>
    </button>
  </div>
  
  <div class="edit-flight-content">
    <app-flight-form #flightForm [editMode]="true"></app-flight-form>
  </div>
  
  <div class="edit-flight-actions">
    <button mat-button class="back-btn" (click)="backToFlights()">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
    <button mat-flat-button color="primary" class="save-btn" [disabled]="flightForm?.form?.invalid ?? true" (click)="editFlight()">
      <mat-icon>save</mat-icon>
      Save Changes
    </button>
  </div>
</div>
