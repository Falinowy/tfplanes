<div class="row justify-content-center login-container">
  <div class="col-sm-4 shadow login-content">
    <img src="./assets/images/logo_tf.png" class="logo">
    <h3>Login</h3>
    <mat-form-field class="d-block">
      <input matInput placeholder="Email" [(ngModel)]="credentials.email" required>
      <mat-error>Email is required</mat-error>
    </mat-form-field>
    <mat-form-field class="d-block">
      <input type="password" matInput placeholder="Password" [(ngModel)]="credentials.password" required>
      <mat-error>Password is required</mat-error>
    </mat-form-field>
    <div style="display: flex; gap: 16px; justify-content: center; margin-top: 10px;">
      <button mat-raised-button color="primary" (click)="login()">LOG IN</button>
      <button mat-stroked-button color="primary" (click)="testLogin()">TEST LOGIN</button>
    </div>
    <p>You don't have an account?</p>
    <button mat-raised-button color="accent" (click)="goToRegister()">REGISTER</button>
  </div>
</div>
