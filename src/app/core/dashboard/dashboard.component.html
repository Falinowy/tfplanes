<mat-toolbar class="modern-header">
  <div class="container header-container">
    <div class="logo-wrapper" routerLink="/dashboard">
      <img src="./assets/images/logo_tf.png" class="logo-img" alt="TF Planes Logo">
      <span class="brand-name">TF Planes</span>
    </div>

    <div class="user-actions">
      <div class="user-profile">
        <div class="avatar">
          <mat-icon>person</mat-icon>
        </div>
        <div class="user-info">
          <span class="greeting">Welcome back,</span>
          <span class="email">{{ user?.email }}</span>
        </div>
      </div>
      <button mat-icon-button class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
